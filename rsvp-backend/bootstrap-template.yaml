AWSTemplateFormatVersion: "2010-09-09"
Description: One-time administrator bootstrap for the NYC RSVP sniper backend

# Creates the long-lived IAM roles and the ECR repository that the main
# rsvp-backend stack depends on. Kept separate (like the RosterLab bootstrap)
# so the GitHub Actions deploy principal never needs iam:CreateRole.
#
# Resource ARNs are scoped by predictable name so these policies can be written
# before the main stack (which owns the concrete resources) exists.

Parameters:
  Environment:
    Type: String
    Default: production
    AllowedValues:
      - production
      - staging

Resources:
  SniperImageRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: !Sub rsvp-sniper-${Environment}
      ImageScanningConfiguration:
        ScanOnPush: true
      ImageTagMutability: MUTABLE
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep only the 5 most recent images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 5
                },
                "action": { "type": "expire" }
              }
            ]
          }

  # Assumed by EventBridge Scheduler to invoke the sniper at the drop time.
  SchedulerInvokeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub rsvp-sniper-scheduler-${Environment}
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: InvokeSniper
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource:
                  - !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:rsvp-sniper-exec-${Environment}

  # Execution role for the requests API Lambda.
  RequestsApiRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub rsvp-sniper-api-${Environment}
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: RsvpApiPermissions
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Logs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/rsvp-sniper-api-${Environment}:*
              - Sid: RequestsTable
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Scan
                  - dynamodb:Query
                Resource:
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/rsvp-sniper-requests-${Environment}
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/rsvp-sniper-requests-${Environment}/index/*
              - Sid: ReadConfigSecret
                Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:rsvp-sniper-${Environment}-*
              - Sid: ManageSchedules
                Effect: Allow
                Action:
                  - scheduler:CreateSchedule
                  - scheduler:UpdateSchedule
                  - scheduler:DeleteSchedule
                  - scheduler:GetSchedule
                Resource:
                  - !Sub arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/rsvp-sniper-${Environment}/*
              - Sid: PassSchedulerRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt SchedulerInvokeRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: scheduler.amazonaws.com

  # Execution role for the sniper (container image) Lambda.
  SniperRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub rsvp-sniper-exec-${Environment}
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: RsvpSniperPermissions
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Logs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/rsvp-sniper-exec-${Environment}:*
              - Sid: RequestsTable
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                Resource:
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/rsvp-sniper-requests-${Environment}
              - Sid: ReadConfigSecret
                Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:rsvp-sniper-${Environment}-*
              - Sid: PublishNotifications
                Effect: Allow
                Action: sns:Publish
                Resource:
                  - !Sub arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:rsvp-sniper-notifications-${Environment}

Outputs:
  ImageRepositoryUri:
    Description: ECR repository URI for the sniper container image
    Value: !GetAtt SniperImageRepository.RepositoryUri
  RequestsApiRoleArn:
    Value: !GetAtt RequestsApiRole.Arn
  SniperRoleArn:
    Value: !GetAtt SniperRole.Arn
  SchedulerInvokeRoleArn:
    Value: !GetAtt SchedulerInvokeRole.Arn
