AWSTemplateFormatVersion: "2010-09-09"
Description: One-time administrator bootstrap for RosterLab backend deployments

Parameters:
  ArtifactBucketName:
    Type: String
    Default: rosterlab-deploy-artifacts-545095759709-us-east-1
  RuntimeRoleName:
    Type: String
    Default: rosterlab-espn-import-production

Resources:
  DeploymentArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref ArtifactBucketName
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldArtifacts
            Status: Enabled
            ExpirationInDays: 14
            NoncurrentVersionExpiration:
              NoncurrentDays: 7
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled

  DeploymentArtifactBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DeploymentArtifactBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt DeploymentArtifactBucket.Arn
              - !Sub ${DeploymentArtifactBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: false

  ImportFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RuntimeRoleName
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: WriteRosterLabImportLogs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${RuntimeRoleName}:*

Outputs:
  ArtifactBucketName:
    Value: !Ref DeploymentArtifactBucket
  RuntimeRoleArn:
    Value: !GetAtt ImportFunctionRole.Arn
