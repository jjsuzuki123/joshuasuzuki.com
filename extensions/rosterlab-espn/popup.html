<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RosterLab ESPN Connector</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <div class="brand">
        <img src="icons/icon-48.png" alt="" width="40" height="40" />
        <div>
          <p>RosterLab</p>
          <h1>ESPN Connector</h1>
        </div>
      </div>
      <p class="summary">
        Sign in on ESPN, choose your baseball league, and sync it to RosterLab.
        The connector never reads or stores your ESPN password or cookies.
      </p>
      <button id="open-rosterlab" type="button">Open RosterLab</button>
      <a
        href="https://www.joshuasuzuki.com/fantasy/connector/privacy.html"
        target="_blank"
        rel="noreferrer"
      >
        Privacy details
      </a>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
