<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Top 5 Artists · Josh Suzuki</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="icon" type="image/svg+xml" href="/transparent-favicon.svg?v=4" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=4" />
  <link rel="icon" href="/favicon.ico?v=4" sizes="any" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=4" />

  <link rel="stylesheet" href="/styles.css" />
  <style>
    .artist-list {
      list-style: none;
      padding: 0;
      margin: 0;
      counter-reset: artist;
    }

    .artist-item {
      display: flex;
      align-items: baseline;
      gap: 0.75rem;
      padding: 0.85rem 0;
      border-bottom: 1px solid #e5e7eb;
    }

    .artist-item:last-child {
      border-bottom: none;
    }

    .artist-rank {
      font-size: 1.1rem;
      font-weight: 700;
      color: #2563eb;
      min-width: 1.5rem;
      text-align: right;
    }

    .artist-info {
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
    }

    .artist-name {
      font-size: 1rem;
      font-weight: 600;
      color: #111827;
    }

    .artist-name a {
      color: inherit;
      text-decoration: none;
    }

    .artist-name a:hover {
      color: #2563eb;
    }

    .artist-genres {
      font-size: 0.78rem;
      color: #6b7280;
    }
  </style>
</head>
<body>
  <div class="cursor-glow"></div>

  <header>
    <div class="header-inner">
      <div class="branding">
        <h1>Josh Suzuki</h1>
        <p class="tagline">Currently at Fastly</p>
      </div>
      <nav>
        <a href="/">Home</a>
        <a href="/#about">About</a>
        <a href="/#timeline">Timeline</a>
        <a href="/#projects">Projects</a>
        <a href="/#contact">Contact</a>
        <a href="/resume/index.html">Resume</a>
        <a href="/artists/index.html">Artists</a>
        <a href="/admin/index.html">Admin</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="section-header">
        <h2>Top 5 Artists</h2>
      </div>
      <div class="section-body">
        <ol id="artist-list" class="artist-list"></ol>
      </div>
    </section>
  </main>

  <footer>
    <div class="footer-inner">
      <p>© <span id="year"></span> Josh Suzuki</p>
      <div class="footer-links">
        <a href="mailto:joshuajamessuzuki@gmail.com">Email</a>
        <a href="https://www.linkedin.com/in/jjsuzuki" target="_blank" rel="noopener noreferrer">LinkedIn</a>
        <a href="https://github.com/jjsuzuki123" target="_blank" rel="noopener noreferrer">GitHub</a>
      </div>
    </div>
  </footer>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();

    var TOP_ARTISTS = [
      { rank: 1, name: "Taylor Swift", genres: ["pop"], spotifyUrl: "https://open.spotify.com/artist/06HL4z0CvFAxyc27GXpf02" },
      { rank: 2, name: "Drake", genres: ["hip hop", "rap", "canadian hip hop"], spotifyUrl: "https://open.spotify.com/artist/3TVXtAsR1Inumwj472S9r4" },
      { rank: 3, name: "The Weeknd", genres: ["canadian contemporary r&b", "pop"], spotifyUrl: "https://open.spotify.com/artist/1Xyo4u8uXC1ZmMpatF05PJ" },
      { rank: 4, name: "Ariana Grande", genres: ["pop", "post-teen pop"], spotifyUrl: "https://open.spotify.com/artist/66CXWjxzNUsdJxJ2JdwvnR" },
      { rank: 5, name: "Ed Sheeran", genres: ["pop", "uk pop", "singer-songwriter"], spotifyUrl: "https://open.spotify.com/artist/6eUKZXaKkcviH0Ku9w2n3V" }
    ];

    (function renderArtists() {
      var list = document.getElementById("artist-list");
      if (!list) return;

      TOP_ARTISTS.forEach(function (artist) {
        var li = document.createElement("li");
        li.className = "artist-item";

        var rank = document.createElement("span");
        rank.className = "artist-rank";
        rank.textContent = artist.rank;

        var info = document.createElement("div");
        info.className = "artist-info";

        var name = document.createElement("span");
        name.className = "artist-name";
        var link = document.createElement("a");
        link.href = artist.spotifyUrl;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = artist.name;
        name.appendChild(link);

        var genres = document.createElement("span");
        genres.className = "artist-genres";
        genres.textContent = artist.genres.join(", ");

        info.appendChild(name);
        info.appendChild(genres);
        li.appendChild(rank);
        li.appendChild(info);
        list.appendChild(li);
      });
    })();
  </script>
</body>
</html>
