name: Deploy to S3 + CloudFront

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      S3_BUCKET: josh-personal-site-1
      CF_DISTRIBUTION_ID: E3LDS3FK17E3JF
      AWS_REGION: us-east-1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::545095759709:role/GitHubActionsDeployPersonalSite
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate RosterLab
        run: |
          set -euo pipefail
          node --check fantasy/app.js
          node --check fantasy/config.js
          node --check fantasy/data.js
          node --check fantasy/espn-client.js
          node --check fantasy/espn-connector.js
          node --check fantasy/trade-engine.js
          node scripts/fantasy-espn-client.test.js
          node scripts/fantasy-espn-connector.test.js
          npm run check --prefix extensions/rosterlab-espn
          npm test --prefix extensions/rosterlab-espn

      - name: Sync to S3
        run: |
          aws s3 sync . s3://${S3_BUCKET} \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude ".cursor/*" \
            --exclude ".DS_Store" \
            --exclude "deploy.sh" \
            --exclude "debug-pdf-fetch.sh" \
            --exclude ".env" \
            --exclude ".env.*" \
            --exclude "*.zip" \
            --exclude "admin-backend/*" \
            --exclude "extensions/*" \
            --exclude "scripts/*" \
            --exclude "permissions-policy.json" \
            --exclude "trust-policy.json"

      - name: Publish RosterLab route and config
        run: |
          aws s3api put-object \
            --bucket "${S3_BUCKET}" \
            --key "fantasy/" \
            --body "fantasy/index.html" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/html; charset=utf-8"
          aws s3 cp "s3://${S3_BUCKET}/fantasy/config.js" "s3://${S3_BUCKET}/fantasy/config.js" \
            --metadata-directive REPLACE \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "application/javascript; charset=utf-8"

      - name: Set HTML Cache-Control (only if files exist)
        run: |
          set -euo pipefail

          set_cache() {
            local key="$1"
            if aws s3api head-object --bucket "${S3_BUCKET}" --key "${key}" >/dev/null 2>&1; then
              echo "Setting Cache-Control for ${key}"
              aws s3 cp "s3://${S3_BUCKET}/${key}" "s3://${S3_BUCKET}/${key}" \
                --metadata-directive REPLACE \
                --cache-control "no-cache, no-store, must-revalidate" \
                --content-type "text/html; charset=utf-8"
            else
              echo "Skipping ${key} (not found in bucket)"
            fi
          }

          set_cache "index.html"
          set_cache "resume/index.html"
          set_cache "admin/index.html"
          set_cache "fantasy/index.html"
          set_cache "fantasy/connector/privacy.html"
        
      - name: Set PDF metadata (Content-Type + inline display)
        run: |
          set -euo pipefail
          if aws s3api head-object --bucket "${S3_BUCKET}" --key "AE Resume - 2026.docx.pdf" >/dev/null 2>&1; then
            echo "Setting Content-Type and Content-Disposition for PDF"
            aws s3 cp "s3://${S3_BUCKET}/AE Resume - 2026.docx.pdf" "s3://${S3_BUCKET}/AE Resume - 2026.docx.pdf" \
              --metadata-directive REPLACE \
              --content-type "application/pdf" \
              --content-disposition "inline"
          else
            echo "Skipping AE Resume - 2026.docx.pdf (not found)"
          fi

      - name: CloudFront invalidation
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${CF_DISTRIBUTION_ID} \
            --paths "/*"
