name: Deploy to S3 + CloudFront

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Verify
        run: ./scripts/verify.sh

      - name: Set up AWS SAM
        uses: aws-actions/setup-sam@f84ec7d548307efafe33230528756de3c5841a17 # v2

      - name: Validate fantasy infrastructure
        run: |
          set -euo pipefail
          sam validate --lint --template-file fantasy-backend/bootstrap-template.yaml
          sam validate --lint --template-file fantasy-backend/template.yaml
          sam validate --lint --template-file fantasy-insights/template.yaml

  deploy:
    name: deploy
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    env:
      S3_BUCKET: josh-personal-site-1
      CF_DISTRIBUTION_ID: E3LDS3FK17E3JF
      AWS_REGION: us-east-1
      FANTASY_IMPORT_STACK: rosterlab-fantasy-import-production
      FANTASY_INSIGHTS_STACK: rosterlab-fantasy-insights-production
      FANTASY_BOOTSTRAP_STACK: rosterlab-fantasy-import-bootstrap
      SAM_ARTIFACT_BUCKET: rosterlab-deploy-artifacts-545095759709-us-east-1
      SOURCE_ENDPOINT: ${{ vars.ROSTERLAB_SOURCE_ENDPOINT }}
      ENABLE_FANTASY_INSIGHTS: ${{ vars.ROSTERLAB_FIRECRAWL_ENABLED || 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Set up AWS SAM
        uses: aws-actions/setup-sam@f84ec7d548307efafe33230528756de3c5841a17 # v2

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: arn:aws:iam::545095759709:role/GitHubActionsDeployPersonalSite
          aws-region: ${{ env.AWS_REGION }}

      - name: Check fantasy backend bootstrap
        id: fantasy-backend
        run: |
          if aws s3api head-bucket --bucket "${SAM_ARTIFACT_BUCKET}" >/dev/null 2>&1; then
            echo "ready=true" >> "${GITHUB_OUTPUT}"
          else
            echo "ready=false" >> "${GITHUB_OUTPUT}"
            echo "Fantasy backend bootstrap is not ready; continuing with static deployment."
          fi

      - name: Check fantasy research bootstrap
        id: fantasy-insights
        run: |
          set -euo pipefail
          if [[ "${ENABLE_FANTASY_INSIGHTS}" != "true" ]]; then
            echo "ready=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          API_ROLE="$(aws cloudformation describe-stacks \
            --stack-name "${FANTASY_BOOTSTRAP_STACK}" \
            --query "Stacks[0].Outputs[?OutputKey=='InsightsApiRuntimeRoleArn'].OutputValue | [0]" \
            --output text 2>/dev/null || true)"
          WORKER_ROLE="$(aws cloudformation describe-stacks \
            --stack-name "${FANTASY_BOOTSTRAP_STACK}" \
            --query "Stacks[0].Outputs[?OutputKey=='InsightsWorkerRuntimeRoleArn'].OutputValue | [0]" \
            --output text 2>/dev/null || true)"
          SECRET_CURRENT="$(aws secretsmanager describe-secret \
            --secret-id rosterlab/firecrawl/production \
            --query "VersionIdsToStages" \
            --output json 2>/dev/null || echo '{}')"
          if [[ "${API_ROLE}" == arn:aws:iam::*:role/* ]] &&
              [[ "${WORKER_ROLE}" == arn:aws:iam::*:role/* ]] &&
              [[ "${SECRET_CURRENT}" == *AWSCURRENT* ]]; then
            echo "ready=true" >> "${GITHUB_OUTPUT}"
          else
            echo "ready=false" >> "${GITHUB_OUTPUT}"
            echo "Firecrawl research is enabled but its bootstrap role or API-key secret is not ready; continuing without it."
          fi

      - name: Build and package fantasy import relay
        if: steps.fantasy-backend.outputs.ready == 'true'
        run: |
          set -euo pipefail
          sam build --template-file fantasy-backend/template.yaml
          sam package \
            --template-file .aws-sam/build/template.yaml \
            --s3-bucket "${SAM_ARTIFACT_BUCKET}" \
            --s3-prefix "rosterlab" \
            --output-template-file fantasy-backend/packaged.yaml

      - name: Deploy fantasy import relay
        if: steps.fantasy-backend.outputs.ready == 'true'
        run: |
          sam deploy \
            --template-file fantasy-backend/packaged.yaml \
            --stack-name "${FANTASY_IMPORT_STACK}" \
            --parameter-overrides Environment=production \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

      - name: Build fantasy research service
        run: |
          set -euo pipefail
          sam build \
            --template-file fantasy-insights/template.yaml \
            --build-dir .aws-sam/insights-build

      - name: Package fantasy research service
        if: steps.fantasy-backend.outputs.ready == 'true' && steps.fantasy-insights.outputs.ready == 'true'
        run: |
          set -euo pipefail
          sam package \
            --template-file .aws-sam/insights-build/template.yaml \
            --s3-bucket "${SAM_ARTIFACT_BUCKET}" \
            --s3-prefix "rosterlab/insights" \
            --output-template-file fantasy-insights/packaged.yaml

      - name: Deploy fantasy research service
        if: steps.fantasy-backend.outputs.ready == 'true' && steps.fantasy-insights.outputs.ready == 'true'
        run: |
          sam deploy \
            --template-file fantasy-insights/packaged.yaml \
            --stack-name "${FANTASY_INSIGHTS_STACK}" \
            --parameter-overrides Environment=production \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

      - name: Configure fantasy data endpoints
        run: |
          set -euo pipefail
          IMPORT_ENDPOINT=""
          RESOLVED_SOURCE_ENDPOINT="${SOURCE_ENDPOINT}"
          SECONDARY_SOURCE_ENDPOINT=""
          RESEARCH_ENDPOINT=""
          if [[ "${{ steps.fantasy-backend.outputs.ready }}" == "true" ]]; then
            IMPORT_ENDPOINT="$(aws cloudformation describe-stacks \
              --stack-name "${FANTASY_IMPORT_STACK}" \
              --query "Stacks[0].Outputs[?OutputKey=='ImportEndpoint'].OutputValue | [0]" \
              --output text)"
          fi
          if [[ "${{ steps.fantasy-insights.outputs.ready }}" == "true" ]]; then
            SECONDARY_SOURCE_ENDPOINT="${RESOLVED_SOURCE_ENDPOINT}"
            RESOLVED_SOURCE_ENDPOINT="$(aws cloudformation describe-stacks \
              --stack-name "${FANTASY_INSIGHTS_STACK}" \
              --query "Stacks[0].Outputs[?OutputKey=='SourceEndpoint'].OutputValue | [0]" \
              --output text)"
            RESEARCH_ENDPOINT="${RESOLVED_SOURCE_ENDPOINT}"
          fi
          IMPORT_ENDPOINT="${IMPORT_ENDPOINT}" \
            SOURCE_ENDPOINT="${RESOLVED_SOURCE_ENDPOINT}" \
            SECONDARY_SOURCE_ENDPOINT="${SECONDARY_SOURCE_ENDPOINT}" \
            RESEARCH_ENDPOINT="${RESEARCH_ENDPOINT}" \
            node scripts/write-fantasy-config.js

      - name: Sync to S3
        run: |
          aws s3 sync . s3://${S3_BUCKET} \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude ".cursor/*" \
            --exclude ".aws-sam/*" \
            --exclude ".DS_Store" \
            --exclude "deploy.sh" \
            --exclude "debug-pdf-fetch.sh" \
            --exclude ".env" \
            --exclude ".env.*" \
            --exclude "*.zip" \
            --exclude "admin-backend/*" \
            --exclude "extensions/*" \
            --exclude "fantasy-backend/*" \
            --exclude "fantasy-insights/*" \
            --exclude "_deploy/*" \
            --exclude "scripts/*" \
            --exclude "permissions-policy.json" \
            --exclude "permissions-policy-expanded.json" \
            --exclude "trust-policy.json"

      - name: Purge infra policy files from the public bucket
        run: |
          # `aws s3 sync --delete` skips excluded keys for deletion too, so
          # excluding the IAM policy files does not remove copies a prior
          # deploy may have published. Delete them explicitly.
          for infra_object in \
            "permissions-policy.json" \
            "permissions-policy-expanded.json" \
            "trust-policy.json"; do
            aws s3 rm "s3://${S3_BUCKET}/${infra_object}" >/dev/null 2>&1 || true
          done

      - name: Publish RosterLab route and config
        run: |
          aws s3api put-object \
            --bucket "${S3_BUCKET}" \
            --key "fantasy/" \
            --body "fantasy/index.html" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/html; charset=utf-8"
          aws s3api put-object \
            --bucket "${S3_BUCKET}" \
            --key "fantasy/football/" \
            --body "fantasy/football/index.html" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/html; charset=utf-8"
          aws s3 cp "s3://${S3_BUCKET}/fantasy/config.js" "s3://${S3_BUCKET}/fantasy/config.js" \
            --metadata-directive REPLACE \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "application/javascript; charset=utf-8"

      - name: Set HTML Cache-Control (only if files exist)
        run: |
          set -euo pipefail

          set_cache() {
            local key="$1"
            if aws s3api head-object --bucket "${S3_BUCKET}" --key "${key}" >/dev/null 2>&1; then
              echo "Setting Cache-Control for ${key}"
              aws s3 cp "s3://${S3_BUCKET}/${key}" "s3://${S3_BUCKET}/${key}" \
                --metadata-directive REPLACE \
                --cache-control "no-cache, no-store, must-revalidate" \
                --content-type "text/html; charset=utf-8"
            else
              echo "Skipping ${key} (not found in bucket)"
            fi
          }

          set_cache "index.html"
          set_cache "resume/index.html"
          set_cache "admin/index.html"
          set_cache "sunset/index.html"
          set_cache "fantasy/index.html"
          set_cache "fantasy/football/index.html"
          set_cache "fantasy/connector/index.html"
          set_cache "fantasy/connector/privacy.html"

      - name: Disable caching for runtime configuration
        run: |
          aws s3 cp "s3://${S3_BUCKET}/fantasy/config.js" "s3://${S3_BUCKET}/fantasy/config.js" \
            --metadata-directive REPLACE \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "application/javascript; charset=utf-8"

      - name: Publish app route aliases
        run: |
          set -euo pipefail
          for key in "sunset" "sunset/"; do
            aws s3api put-object \
              --bucket "${S3_BUCKET}" \
              --key "${key}" \
              --body "sunset/index.html" \
              --cache-control "no-cache, no-store, must-revalidate" \
              --content-type "text/html; charset=utf-8" >/dev/null
          done
          for key in "fantasy" "fantasy/"; do
            aws s3api put-object \
              --bucket "${S3_BUCKET}" \
              --key "${key}" \
              --body "fantasy/index.html" \
              --cache-control "no-cache, no-store, must-revalidate" \
              --content-type "text/html; charset=utf-8" >/dev/null
          done
          for key in "fantasy/football" "fantasy/football/"; do
            aws s3api put-object \
              --bucket "${S3_BUCKET}" \
              --key "${key}" \
              --body "fantasy/football/index.html" \
              --cache-control "no-cache, no-store, must-revalidate" \
              --content-type "text/html; charset=utf-8" >/dev/null
          done

      - name: Set PDF metadata (Content-Type + inline display)
        run: |
          set -euo pipefail
          if aws s3api head-object --bucket "${S3_BUCKET}" --key "AE Resume - 2026.docx.pdf" >/dev/null 2>&1; then
            echo "Setting Content-Type and Content-Disposition for PDF"
            aws s3 cp "s3://${S3_BUCKET}/AE Resume - 2026.docx.pdf" "s3://${S3_BUCKET}/AE Resume - 2026.docx.pdf" \
              --metadata-directive REPLACE \
              --content-type "application/pdf" \
              --content-disposition "inline"
          else
            echo "Skipping AE Resume - 2026.docx.pdf (not found)"
          fi

      - name: CloudFront invalidation
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${CF_DISTRIBUTION_ID} \
            --paths "/*"
